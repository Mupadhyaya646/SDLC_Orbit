name: Load Credentials through GitHub Actions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to load credentials for'
        required: true
        default: 'dev'
  pull_request:
    branches:
      - main
    paths:
      - 'sdlc_orbit/**'
      - 'migrations/**'
      - 'frontend/**'
      - 'toolkits/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/build-push-image.yaml'
  push:
    branches:
      - main
    paths:
      - 'sdlc_orbit/**'
      - 'migrations/**'
      - 'frontend/**'
      - 'toolkits/**'
      - 'Dockerfile'
      - 'requirements.txt'
    tags:
      - v*

jobs:
  Load-Credentials:
    uses: EliLillyCo/hangar/.github/workflows/load-credentials.yaml@main
    with:
      environment: ${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'prd') || 'dev' }}
